# 文件说明：纯静态版 nginx 配置（当前站点只保留简历页，无 /api、/files 反代）。
# 放置位置：/etc/nginx/sites-available/myblog（再软链到 sites-enabled）
#
# 站点根目录：/var/www/myblog（dist 内容直接铺在这里）

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /var/www/myblog;
	index index.html;
	charset utf-8;

	access_log /var/log/nginx/myblog.access.log;
	error_log  /var/log/nginx/myblog.error.log warn;

	gzip on;
	gzip_comp_level 5;
	gzip_min_length 1k;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

	# 静态站没有后端：任何 /api、/files 请求直接 404，避免误判为服务挂了
	location /api/ {
		return 404;
	}

	location /files/ {
		return 404;
	}

	location / {
		try_files $uri $uri/ $uri.html =404;
		add_header Cache-Control "no-cache";
	}

	# Astro 产物文件名带内容哈希，可长缓存
	location /_astro/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location = /favicon.ico {
		expires 7d;
		access_log off;
	}
}
