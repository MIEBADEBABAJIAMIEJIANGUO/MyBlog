# 文件说明：生产环境 Nginx 配置（无域名版，直接用服务器 IP 的 80 端口）。
# 放置位置：/etc/nginx/conf.d/myblog.conf
#
# 三个入口：
#   /        静态站（Astro 构建产物 dist/）
#   /api/    反代 Express（3001），SSE 必须关闭缓冲
#   /files/  反代 MinIO 的 uploads bucket（公开读）

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /var/www/myblog/dist;
	index index.html;

	# 上传接口按 10MB 分片走，这里给到 64MB 留余量（整文件上传上限 10MB）
	client_max_body_size 64m;
	client_body_timeout 300s;

	access_log /var/log/nginx/myblog.access.log;
	error_log  /var/log/nginx/myblog.error.log warn;

	gzip on;
	gzip_comp_level 5;
	gzip_min_length 1k;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	# ---------- 静态站 ----------
	location / {
		try_files $uri $uri/ $uri.html =404;
		add_header Cache-Control "no-cache";
	}

	# Astro 产物带内容哈希，可以长缓存
	location /_astro/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# ---------- API ----------
	location /api/ {
		proxy_pass http://127.0.0.1:3001;
		proxy_http_version 1.1;

		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection        "";

		# SSE（Agent 流式对话）：不缓冲、不缓存、长超时，否则会「卡住后一次性吐完」
		proxy_buffering off;
		proxy_cache off;
		proxy_request_buffering off;
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
	}

	# ---------- MinIO 公开读 ----------
	# 应用侧 PUBLIC_FILE_BASE_URL=http://<IP>/files，对象 URL = <base>/<objectKey>
	location /files/ {
		proxy_pass http://127.0.0.1:9000/uploads/;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header Connection "";

		proxy_buffering off;
		proxy_read_timeout 300s;
	}

	# MinIO 控制台不对外，如需临时访问请走 SSH 端口转发
	location = /minio-console {
		return 404;
	}
}
